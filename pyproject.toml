[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-experiments"
version = "0.1.0"
description = "Leakage-aware tennis forecasting experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["tennis_experiments*"]
